# Manual npm publish.
#
# Repository secret: NPM_TOKEN — must bypass 2FA or publish fails with EOTP:
#   • Classic token: type "Automation" (not "Publish") at https://www.npmjs.com/settings/~/tokens
#   • Granular token: enable "Bypass two-factor authentication" + Packages: Read and write
#
# Run from Actions → Release → Run workflow (choose branch, usually main).
name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Semver bump applied to package.json
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Cache Bun install
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-install-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify (typecheck, test, build)
        run: |
          bun run typecheck
          bun test
          bun run build

      - name: Setup Node (npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify npm token (publish without OTP)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is missing. Add it under Settings → Secrets → Actions."
            exit 1
          fi
          npm whoami
          npm publish --dry-run --access public

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        env:
          VERSION_BUMP: ${{ inputs.version_bump }}
        run: |
          npm version "$VERSION_BUMP" -m "chore(release): %s"

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push version commit and tag
        run: git push origin "HEAD:${{ github.ref_name }}" --follow-tags
